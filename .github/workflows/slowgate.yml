name: slowgate
on:
  pull_request:
  merge_group:
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - name: OUTSIDER FORCES THE OTHER DIRECTION
        run: |
          echo "GATE-VERSION=outsider-forced-fail"
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "GATE-RESULT=FAIL forced by position 1"
            exit 1
          fi
          echo "GATE-RESULT=PASS on pull_request so this PR stays enqueueable"
