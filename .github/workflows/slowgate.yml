name: slowgate
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - name: fast on pull_request
        if: github.event_name == 'pull_request'
        run: echo pr-ok
      - name: does a DEQUEUE stop this job, and does the token outlive the entry?
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          REF: ${{ github.ref }}
          S: ${{ github.sha }}
        run: |
          A="Authorization: Bearer $GH_TOKEN"; AC="Accept: application/vnd.github+json"
          BR=$(echo "$REF" | sed 's#refs/heads/##')
          echo "LIFE-CANDIDATE-REF=$BR"
          for i in $(seq 1 24); do
            refcode=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$AC" \
              "https://api.github.com/repos/$R/git/ref/heads/$BR")
            wcode=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$A" -H "$AC" \
              "https://api.github.com/repos/$R/git/refs" \
              -d "{\"ref\":\"refs/heads/life-$GITHUB_RUN_ID-$i\",\"sha\":\"$S\"}")
            ucode=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" -H "$AC" \
              "https://api.github.com/repos/$R")
            echo "LIFE i=$i t=$((i*20))s candidate_ref=$refcode base_write=$wcode repo_read=$ucode"
            sleep 20
          done
          echo "LIFE-LOOP-COMPLETE"
